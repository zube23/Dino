<script>
'use strict';
/* Deterministic stage: everything is a pure function of time t (ms).
   Python computes the timeline (absolute beat times, talk spans, sfx);
   this file only draws. window.__load(tl) then window.__seek(ms).      */

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,u) => a + (b-a)*u;
const easeOutCubic = u => 1 - Math.pow(1-u,3);
const easeInQuad = u => u*u;
const easeOutBack = u => { const c=1.70158; return 1 + (c+1)*Math.pow(u-1,3) + c*Math.pow(u-1,2); };

function mulberry32(seed){ let a = seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function seededVals(seed,n){ const r=mulberry32(seed); const o=[]; for(let i=0;i<n;i++)o.push(r()); return o; }

/* ---------- palettes & scenes ---------- */

/* ---------- global state ---------- */
let TL = null;   // timeline
let READY = false;

const nodes = {};
['bg','bgDecor','cam','scene','props','frontProps','char','charRoot','tail','tailP','legL','legR','bodyG','armL','armR',
 'headG','headInner','mouthOpen','teeth','jaw','mouthLine','pupL','pupR','lidL','lidR','lidLineL','lidLineR',
 'browL','browR','fx','capG','cap','capL1','capL2','topG','topPill','topT','ground','handProp'
].forEach(id => nodes[id] = $(id));

/* ---------- caption layout ---------- */
function setCaption(txt, style){
  const c1 = nodes.capL1, c2 = nodes.capL2, cap = nodes.cap;
  const isFx = style==='fx';
  let size = isFx ? 62 : 76;
  const maxW = 920;
  const words = txt.split(' ');
  const fit = (sz) => {
    cap.setAttribute('font-size', sz);
    c2.textContent='';
    c1.textContent = txt;
    if(c1.getComputedTextLength() <= maxW) return true;
    // two lines: balance
    let best=null;
    for(let i=1;i<words.length;i++){
      c1.textContent = words.slice(0,i).join(' ');
      c2.textContent = words.slice(i).join(' ');
      const w = Math.max(c1.getComputedTextLength(), c2.getComputedTextLength());
      if(w<=maxW && (best===null || w<best.w)) best={i,w};
    }
    if(best){ c1.textContent=words.slice(0,best.i).join(' '); c2.textContent=words.slice(best.i).join(' '); return true; }
    return false;
  };
  while(size>44 && !fit(size)) size -= 6;
  c2.setAttribute('dy', c2.textContent ? size*1.14 : 0);
  cap.setAttribute('fill', isFx ? '#FFE066' : '#FFFFFF');
  cap.setAttribute('stroke-width', isFx ? 13 : 16);
  const nLines = c2.textContent ? 2 : 1;
  cap.setAttribute('y', nLines===2 ? 1548 - size*0.55 : 1580);
}

/* ---------- fx drawing (recreated each frame; cheap) ---------- */
function drawFx(beat, u, t){
  const fx = nodes.fx;
  while(fx.firstChild) fx.removeChild(fx.firstChild);
  const list = beat.fx || [];
  for(const name of list){
    if(name==='confetti'){
      const vals = seededVals(beat.i*77+5, 120);
      for(let i=0;i<28;i++){
        const x0 = 100+vals[i*4]*880, delay = vals[i*4+1]*0.35, spd = 700+vals[i*4+2]*700;
        const uu = clamp((u-delay)/(1-delay+1e-6),0,1);
        const y = -60 + uu*spd*1.6, x = x0 + Math.sin((t/300)+i)*40;
        const rot = (t/2.4+i*47)%360;
        const cols=['#FFD166','#E63946','#7C5CFF','#2A9D8F','#FF8FAB'];
        if(y<2000) el('rect',{x:x,y:y,width:26,height:16,rx:4,fill:cols[i%5],transform:`rotate(${rot} ${x+13} ${y+8})`},fx);
      }
    } else if(name==='sweat'){
      const ph = (t/650)%1;
      const y = 640 + ph*260, op = 1-ph;
      el('path',{d:`M 730 ${y} q 26 46 0 68 q -26 -22 0 -68`, fill:'#8ECAE6', stroke:'#123B39','stroke-width':7, opacity:op},fx);
      const ph2 = ((t+400)/650)%1;
      el('path',{d:`M 350 ${660+ph2*240} q 22 40 0 58 q -22 -18 0 -58`, fill:'#8ECAE6', stroke:'#123B39','stroke-width':7, opacity:1-ph2},fx);
    } else if(name==='zzz'){
      for(let i=0;i<3;i++){
        const ph=((t/1500)+i*0.33)%1;
        el('text',{x:700+i*54+Math.sin(ph*TAU)*18, y:640-ph*220, 'font-size':64+i*10,'font-weight':800,fill:'#FFF',stroke:'#10121A','stroke-width':8,'paint-order':'stroke',opacity:(1-ph)*0.95},fx).textContent='Z';
      }
    } else if(name==='impact'){
      if(u<0.5){ const s = 1+u*1.4, op=1-u*2;
        const g = el('g',{transform:`translate(540 980) scale(${s})`,opacity:op},fx);
        for(let i=0;i<8;i++){ const a=i*TAU/8 + 0.3;
          el('line',{x1:Math.cos(a)*180,y1:Math.sin(a)*180,x2:Math.cos(a)*330,y2:Math.sin(a)*330,stroke:'#FFF','stroke-width':16,'stroke-linecap':'round'},g); }
      }
    } else if(name==='stars'){
      for(let i=0;i<3;i++){ const a=(t/700)*TAU/2 + i*TAU/3;
        const x=540+Math.cos(a)*150, y=560+Math.sin(a)*36;
        el('text',{x:x,y:y,'font-size':58,fill:'#FFD166',stroke:'#10121A','stroke-width':7,'paint-order':'stroke','text-anchor':'middle'},fx).textContent='★'; }
    } else if(name==='q_mark' || name==='e_mark'){
      const pop = easeOutBack(clamp(u*3,0,1));
      el('text',{x:760,y:560,'font-size':150*pop,'font-weight':800,fill:'#FFE066',stroke:'#10121A','stroke-width':14,'paint-order':'stroke','text-anchor':'middle'},fx).textContent = name==='q_mark'?'?':'!';
    } else if(name==='photo_nostril'){
      const pop = easeOutBack(clamp(u*2.2,0,1));
      const g = el('g',{transform:`translate(540 760) scale(${pop}) rotate(-5)`},fx);
      el('rect',{x:-240,y:-300,width:480,height:600,rx:14,fill:'#FFF',stroke:'#10121A','stroke-width':10},g);
      el('rect',{x:-208,y:-268,width:416,height:440,rx:8,fill:'#1FB5A9'},g);
      el('ellipse',{cx:-90,cy:-60,rx:64,ry:86,fill:'#123B39'},g);
      el('ellipse',{cx:96,cy:-52,rx:60,ry:82,fill:'#123B39'},g);
      el('text',{x:0,y:238,'font-size':54,'font-weight':800,'text-anchor':'middle',fill:'#10121A'},g).textContent='IMG_0001.jpg';
    } else if(name==='flash'){
      if(u<0.22) el('rect',{x:0,y:0,width:1080,height:1920,fill:'#FFF',opacity:(1-u/0.22)*0.9},fx);
    } else if(name==='wind'){
      for(let i=0;i<3;i++){ const ph=((t/900)+i*0.31)%1;
        el('path',{d:`M ${-200+ph*1400} ${420+i*180} q 90 -34 180 0 q 90 34 180 0`,fill:'none',stroke:'#FFF','stroke-width':12,'stroke-linecap':'round',opacity:(1-Math.abs(ph-0.5)*2)*0.7},fx); }
    }
  }
}

/* ---------- character pose ---------- */
function setTransform(n, str){ n.setAttribute('transform', str); }

function pose(t, beat, u){
  const m = Object.assign({}, MOODS[beat.mood||'neutral']);
  const act = beat.action || 'idle';
  const tSec = t/1000;

  // defaults
  let charX=0, charY=0, charRot=0, charSX=1, charSY=1;
  let headRot=0, headX=0, headY=0;
  let armLRot=0, armRRot=0, tailRot=Math.sin(tSec*TAU*0.45)*5;
  let legLRot=0, legRRot=0, legLY=0, legRY=0;
  let breathAmp = 0.012;

  // talking jaw
  let open = 0;
  if(beat.talk && t>=beat.talk[0] && t<=beat.talk[1]){
    const tt=(t-beat.talk[0])/1000;
    open = 0.24 + 0.52*Math.abs(Math.sin(tt*TAU*4.4 + Math.sin(tt*7)*0.9));
    headY += Math.sin(tt*TAU*4.4)*2.2;
  }

  // blink (unless mood pins lids)
  let lids = m.lids;
  if(m.lids<0.7){
    const bl = (t % 3100);
    if(bl<130) lids = Math.max(lids, Math.sin(bl/130*Math.PI));
  }

  if(act==='idle'){ /* defaults */ }
  else if(act==='walkin'){
    const w = easeOutCubic(clamp(u*1.12,0,1));
    charX = lerp(-760, 0, w);
    if(w<0.98){ const ph=tSec*TAU*3.1;
      legLRot=Math.sin(ph)*24; legRRot=Math.sin(ph+Math.PI)*24;
      charY = -Math.abs(Math.sin(ph))*16; charRot=3; }
  }
  else if(act==='sadwalk'){
    const w = easeInQuad(clamp(u*1.05,0,1));
    charX = lerp(0, 820, w);
    const ph=tSec*TAU*1.7;
    legLRot=Math.sin(ph)*16; legRRot=Math.sin(ph+Math.PI)*16;
    charY=-Math.abs(Math.sin(ph))*8; headRot=13; m.slump=(m.slump||0)+10;
  }
  else if(act==='point'){
    const p = easeOutBack(clamp(u*2.6,0,1));
    armRRot = -108*p; charRot = 4*p; headRot = -3*p;
  }
  else if(act==='reach'){
    charRot = 16; charY = -12; charX = 60 + Math.sin(tSec*TAU*13)*2.6;
    armRRot = -118 + Math.sin(tSec*TAU*8.5)*26;
    armLRot = -95 + Math.sin(tSec*TAU*8.5+1.4)*22;
    headRot = 6; m.pupDX = 8;
    legLY = -6;
  }
  else if(act==='stare'){ breathAmp=0.006; }
  else if(act==='hop'){
    const hops = beat.dur>1.3?2:1, hu=(u*hops)%1;
    charY = -170*4*hu*(1-hu);
    if(hu>0.92||hu<0.06){ charSY=0.86; charSX=1.1; }
    tailRot = -14; armLRot=-30; armRRot=-30;
  }
  else if(act==='nod'){ headRot = Math.sin(u*TAU*2)*13; }
  else if(act==='shake_no'){ headX = Math.sin(u*TAU*2.5)*22; }
  else if(act==='panic'){
    const ph=tSec*TAU*6.4;
    legLRot=Math.sin(ph)*34; legRRot=Math.sin(ph+Math.PI)*34;
    charY=-Math.abs(Math.sin(ph))*22;
    armLRot=-60+Math.sin(ph*1.6)*40; armRRot=-60+Math.sin(ph*1.6+2)*40;
    charX=Math.sin(tSec*TAU*2.2)*30; headRot=Math.sin(ph*0.5)*6;
  }
  else if(act==='typing'){
    charX=0; headRot=7;
    armLRot=-38+Math.sin(tSec*TAU*7.5)*14; armRRot=-38+Math.sin(tSec*TAU*7.5+2.2)*14;
  }
  else if(act==='flex'){
    if(u<0.55){ const p=easeOutBack(clamp(u/0.4,0,1)); armLRot=-135*p; armRRot=-135*p;
      if(u>0.3){ armLRot+=Math.sin(tSec*TAU*16)*5; armRRot+=Math.sin(tSec*TAU*16)*5; } }
    else { armLRot=-20; armRRot=-20; m.slump=(m.slump||0)+8; headRot=8; }
  }
  else if(act==='lookup'){ headRot=-15; m.pupDY=-6; }
  else if(act==='slump'){
    const p=easeOutCubic(clamp(u*1.6,0,1));
    charRot=17*p; charY=26*p; headRot=16*p; m.slump=(m.slump||0)+12*p;
  }
  else if(act==='celebrate'){
    const hu=(u*3)%1; charY=-140*4*hu*(1-hu);
    armLRot=-120+Math.sin(tSec*TAU*3)*16; armRRot=-120+Math.sin(tSec*TAU*3+1)*16;
    tailRot=Math.sin(tSec*TAU*2)*14;
  }
  else if(act==='eat'){
    // big chomp: tilt back, jaw huge, then gulp
    if(u<0.3){ const p=u/0.3; headRot=-22*p; open=Math.max(open,1.7*p); }
    else if(u<0.55){ headRot=-22; open=1.7; }
    else if(u<0.7){ const p=(u-0.55)/0.15; headRot=-22+26*p; open=1.7*(1-p); charSY=1+0.06*Math.sin(p*Math.PI); }
    else { headRot=4; open=0; m.curve=0.1; }
  }
  else if(act==='smash'){
    if(u<0.35){ const p=easeOutCubic(u/0.35); charX=-40*p; charRot=-8*p; }
    else if(u<0.55){ tailRot=-70*easeOutCubic((u-0.35)/0.2); charRot=6; }
    else { tailRot=-70+90*easeOutCubic((u-0.55)/0.45); charRot=0; }
  }

  // breathing
  charSY *= 1 + breathAmp*Math.sin(tSec*TAU*0.42);

  // slump: shoulders/head down
  headY += (m.slump||0)*1.6;
  charY += (m.slump||0)*0.5;

  /* apply */
  setTransform(nodes.char, `translate(${540+charX} ${1420+charY}) rotate(${charRot}) scale(${charSX} ${charSY})`);
  setTransform(nodes.legL, `rotate(${legLRot} -82 -170) translate(0 ${legLY})`);
  setTransform(nodes.legR, `rotate(${legRRot} 82 -170) translate(0 ${legRY})`);
  setTransform(nodes.armL, `rotate(${armLRot} -128 -430)`);
  setTransform(nodes.armR, `rotate(${armRRot} 128 -430)`);
  setTransform(nodes.tail, `rotate(${tailRot} 40 -170)`);
  setTransform(nodes.headG, `translate(${headX} ${headY+((open>0.05)?2:0)}) rotate(${headRot} 0 -510)`);

  /* face */
  const openPx = open*74;
  nodes.mouthOpen.setAttribute('height', openPx);
  nodes.mouthOpen.setAttribute('y', -548);
  setTransform(nodes.jaw, `translate(0 ${openPx})`);
  if(open>0.05){
    nodes.mouthLine.setAttribute('opacity',0);
    // teeth: zigzag strip at top of opening
    let d='M -100 -548 ';
    for(let i=0;i<6;i++){ d+=`l 17 22 l 17 -22 `; }
    nodes.teeth.setAttribute('d', d);
    nodes.teeth.setAttribute('opacity',1);
  } else {
    nodes.teeth.setAttribute('opacity',0);
    nodes.mouthLine.setAttribute('opacity',1);
    const c = m.curve*26;
    nodes.mouthLine.setAttribute('d', `M -84 ${-540+ (m.curve<0? -c*0.3 : 0)} Q 0 ${-534 + c} 84 ${-540 + (m.curve<0? -c*0.3 : 0)}`);
  }

  /* eyes */
  const lidH = 58 * clamp(lids,0,1) * 2;   // covers from top
  for(const side of ['L','R']){
    const lid = nodes['lid'+side], line = nodes['lidLine'+side];
    lid.setAttribute('height', Math.min(lidH,116));
    lid.setAttribute('y', -762);
    lid.setAttribute('fill', '#17A398');
    if(lids>=0.97){
      line.setAttribute('d', side==='L' ? 'M -118 -700 Q -80 -684 -42 -700' : 'M 42 -700 Q 80 -684 118 -700');
      line.setAttribute('opacity',1);
    } else line.setAttribute('opacity',0);
  }
  const pupScale = m.pupil, pdx = (beat.pupDX||m.pupDX||0), pdy = m.pupDY||0;
  nodes.pupL.setAttribute('r', 17*pupScale); nodes.pupR.setAttribute('r', 17*pupScale);
  nodes.pupL.setAttribute('cx', -80+pdx); nodes.pupL.setAttribute('cy', -700+pdy+Math.min(lidH*0.14,8));
  nodes.pupR.setAttribute('cx', 80+pdx); nodes.pupR.setAttribute('cy', -700+pdy+Math.min(lidH*0.14,8));
  setTransform(nodes.browL, `translate(0 ${m.browY}) rotate(${m.browRotL} -79 -778)`);
  setTransform(nodes.browR, `translate(0 ${m.browY}) rotate(${m.browRotR} 79 -778)`);
}

/* ---------- scene management ---------- */
let curBg=null, curProps='';
function applyScene(beat){
  const bgName = beat.bg || 'office';
  if(bgName!==curBg){
    const b = BGS[bgName]||BGS.office;
    nodes.bg.setAttribute('fill', b.c);
    nodes.ground.setAttribute('fill', b.ground);
    nodes.ground.setAttribute('opacity', bgName==='void'?0.5:0.55);
    while(nodes.bgDecor.firstChild) nodes.bgDecor.removeChild(nodes.bgDecor.firstChild);
    if(bgName!=='void') nodes.bgDecor.appendChild(decorFor(bgName));
    curBg=bgName;
  }
  const key = (beat.props||[]).join(',');
  if(key!==curProps){
    while(nodes.props.firstChild) nodes.props.removeChild(nodes.props.firstChild);
    while(nodes.frontProps.firstChild) nodes.frontProps.removeChild(nodes.frontProps.firstChild);
    while(nodes.handProp.firstChild) nodes.handProp.removeChild(nodes.handProp.firstChild);
    for(const p of (beat.props||[])){
      if(p==='desk') nodes.frontProps.appendChild(propFor(p));
      else if(p==='phone'){ const g=propFor(p); g.setAttribute('transform','translate(196 -352) rotate(18)'); nodes.handProp.appendChild(g); }
      else nodes.props.appendChild(propFor(p));
    }
    curProps=key;
  }
}

/* dynamic prop animation (per-frame) */
function animateProps(beat, u, t){
  // router LED blink
  const led = document.getElementById('routerLED');
  if(led) led.setAttribute('fill', (Math.floor(t/420)%2===0)?'#E63946':'#7A1F28');
  // alarm ringing shake
  const ck = document.getElementById('alarmClock');
  if(ck && beat.ring){ ck.setAttribute('transform',`translate(${Math.sin(t/26)*6} 0) rotate(${Math.sin(t/22)*4} 785 1170)`);
    const a=document.getElementById('alarmRingA'), b=document.getElementById('alarmRingB');
    const on = Math.floor(t/220)%2===0?1:0.25; if(a){a.setAttribute('opacity',on);} if(b){b.setAttribute('opacity',on);} }
  if(ck && beat.action==='smash' && u>0.5){ const p=easeOutCubic(clamp((u-0.5)/0.2,0,1));
    ck.setAttribute('transform',`translate(0 ${p*40}) scale(1 ${1-0.75*p})`); ck.setAttribute('transform-origin','785 1420'); }
  // food (cake or jar) eaten
  const food = document.getElementById('cakeG') || document.getElementById('jarG');
  if(food && beat.action==='eat'){
    if(u<0.3){ } else if(u<0.55){ const p=(u-0.3)/0.25;
      const x=lerp(0,-260,p), y=lerp(0,-660,easeInQuad(p)), s=lerp(1,0.12,p);
      food.setAttribute('transform',`translate(${810+x} ${1250+y}) scale(${s}) translate(-810 -1250)`);
    } else food.setAttribute('opacity',0);
  }
  // mug wobble during reach
  const mug = document.getElementById('mugG');
  if(mug && beat.action==='reach') mug.setAttribute('transform',`rotate(${Math.sin(t/90)*2.2} 885 560)`);
  // hat flying
  const hat = document.getElementById('hatG');
  if(hat){
    if(beat.hatFly){
      const px = 540+Math.sin(u*TAU*1.2)*330 + u*180, py = 700 - Math.sin(u*Math.PI)*260 + u*90;
      hat.setAttribute('transform',`translate(${px} ${py}) rotate(${u*720})`);
    } else hat.setAttribute('transform','translate(540 604) rotate(-4)');
  }
}

/* ---------- camera ---------- */
function camera(t, beat, u){
  const total = TL.total;
  let s = 1 + 0.045*(t/total);
  let dx=0, dy=0;
  if(beat.punch){
    const p = easeOutBack(clamp(u/0.2,0,1));
    s += 0.20*p;
    const decay = Math.max(0, 1-u*2.4);
    dx = Math.sin(t/17)*7*decay; dy = Math.cos(t/21)*6*decay;
  }
  if(beat.shake){
    dx += Math.sin(t/16)*8; dy += Math.cos(t/19)*7;
  }
  const cx=540, cy=1000;
  setTransform(nodes.cam, `translate(${cx-cx*s+dx} ${cy-cy*s+dy}) scale(${s})`);
}

/* ---------- main seek ---------- */
window.__load = function(tl){
  TL = tl;
  for(let i=0;i<TL.beats.length;i++) TL.beats[i].i = i;
  curBg=null; curProps='__init__';
  READY = true;
  return TL.beats.length;
};

window.__seek = function(t){
  if(!READY) return false;
  let beat = TL.beats[0];
  for(const b of TL.beats){ if(t>=b.t0){ beat=b; } }
  const u = clamp((t-beat.t0)/Math.max(1,(beat.t1-beat.t0)),0,1);

  applyScene(beat);
  pose(t, beat, u);
  animateProps(beat, u, t);
  camera(t, beat, u);
  drawFx(beat, u, t);

  // caption
  if(beat.caption){
    const born = clamp((t-beat.t0)/180,0,1);
    const pop = easeOutBack(born);
    nodes.capG.setAttribute('opacity', Math.min(1,born*2));
    setTransform(nodes.capG, `translate(540 1560) scale(${0.82+0.18*pop}) rotate(-1.2) translate(-540 -1560)`);
    if(nodes.capG.dataset.txt!==beat.caption+beat.capStyle){
      setCaption(beat.caption, beat.capStyle);
      nodes.capG.dataset.txt=beat.caption+beat.capStyle;
    }
  } else nodes.capG.setAttribute('opacity', 0);

  // top pill
  if(beat.top){
    nodes.topG.setAttribute('opacity', clamp((t-beat.t0)/160,0,1));
    if(nodes.topG.dataset.txt!==beat.top){
      nodes.topT.textContent = beat.top;
      const w = nodes.topT.getComputedTextLength()+110;
      nodes.topPill.setAttribute('x', 540-w/2); nodes.topPill.setAttribute('width', w);
      nodes.topG.dataset.txt=beat.top;
    }
  } else nodes.topG.setAttribute('opacity', 0);

  return true;
};

window.__ready = () => READY;
</script>
