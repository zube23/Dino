name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core tests
        run: node test/run-tests.js

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build installer and portable exe
        run: npm run dist -- --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DinoNest-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: DinoNest ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: dist/*.exe
          body: |
            DinoNest za Windows — offline nesting program za laserski rez.

            - **DinoNest-Setup-*.exe** — installer (preporučeno): pokrenite i slijedite korake.
            - **DinoNest-Portable-*.exe** — radi bez instalacije, samo pokrenite.

            Prebacite datoteku na USB i pokrenite na računalu lasera. Internet nije potreban.
